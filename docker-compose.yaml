services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfiles: dockerfiles/backend.dockerfile
    ports:
       - "8000:8000"


  frontend:
    container_name: frontend
    build:
      context: .
      dockerfiles: dockerfiles/frontend.dockerfile
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
